name=TinyJPEG
version=0.2.0
author=Phil Schatzmann
maintainer=Phil Schatzmann
sentence=A header-only baseline JPEG decoder and encoder for microcontrollers; the decoder is ported from Bodmer's TJpg_Decoder/ChaN's TJpgDec, the encoder is a clean-room implementation.
paragraph=Decodes baseline (non-progressive) JPEG images one MCU block at a time via a callback, for pushing to a TFT or framebuffer without holding a whole decoded frame in memory. Also encodes a full RGB888/grayscale frame (e.g. a camera buffer) to a baseline JPEG, streaming the compressed output to a file, callback, or fixed array. Header-only C++17, no Arduino.h dependency in the core, also usable from plain CMake/ESP-IDF projects. No dynamic library dependencies.
category=Data Processing
url=https://github.com/pschatzmann/TinyJPEG
architectures=*
includes=TinyJPEGDecoder.h,TinyJPEGEncoder.h
